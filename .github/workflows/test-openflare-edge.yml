name: Test OpenFlare Edge

on:
  pull_request:
    paths:
      - edge/pingora/**
      - shared/**
      - scripts/*-openflare-edge.sh
      - .github/workflows/test-openflare-edge.yml
  push:
    branches: [main, canary]
    tags: ["edge-v*"]
    paths:
      - edge/pingora/**
      - shared/**
      - scripts/*-openflare-edge.sh
      - .github/workflows/test-openflare-edge.yml
  workflow_dispatch:

concurrency:
  group: edge-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_MANIFEST: edge/pingora/Cargo.toml
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    name: Test Edge (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment scripts
        run: |
          for script in scripts/{install,update,uninstall}-openflare-edge.sh; do
            bash -n "$script"
          done
          grep -Fx 'Type=notify' scripts/install-openflare-edge.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache test dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/pingora
          shared-key: openflare-edge-test-${{ matrix.target }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: Run unit tests
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --manifest-path "$CARGO_MANIFEST" --target "$TARGET"

      - name: Build and test native runtime
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo build --locked --manifest-path "$CARGO_MANIFEST" --target "$TARGET"
          binary="edge/pingora/target/${TARGET}/debug/openflare-edge"
          python3 edge/pingora/tests/runtime_smoke.py "$binary"
