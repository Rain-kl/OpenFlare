name: Build OpenFlare Edge Release

on:
  push:
    tags: ["edge-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing Edge release tag, for example edge-v0.1.3"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_MANIFEST: edge/pingora/Cargo.toml

jobs:
  build:
    name: Build edge ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == push ]]; then
            version="${GITHUB_REF_NAME}"
            source_ref="${GITHUB_SHA}"
          else
            version="${INPUT_VERSION}"
            source_ref="refs/tags/${version}"
          fi
          [[ "${version}" =~ ^edge-v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid edge version: ${version}" >&2
            exit 1
          }
          printf 'version=%s\nsource_ref=%s\n' "$version" "$source_ref" >> "$GITHUB_OUTPUT"
          if [[ "${version#edge-v}" == *-* ]]; then
            printf 'prerelease=true\nmake_latest=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prerelease=false\nmake_latest=true\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'OPENFLARE_EDGE_VERSION=%s\n' "${version#edge-v}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.source_ref }}

      - name: Validate deployment scripts
        run: |
          bash -n scripts/install-openflare-edge.sh scripts/update-openflare-edge.sh scripts/uninstall-openflare-edge.sh
          grep -Fx 'Type=notify' scripts/install-openflare-edge.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: edge/pingora
          key: ${{ matrix.arch }}

      - name: Test
        run: cargo test --locked --manifest-path "$CARGO_MANIFEST"

      - name: Build and package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --locked --release --manifest-path "$CARGO_MANIFEST" --target "$TARGET"
          binary="edge/pingora/target/${TARGET}/release/openflare-edge"
          actual_version="$("$binary" --version)"
          [[ "$actual_version" == "openflare-edge ${VERSION#edge-v}" ]] || {
            echo "unexpected binary version for ${VERSION}: ${actual_version}" >&2
            exit 1
          }
          package_name="openflare-edge_${VERSION}_linux_${ARCH}"
          staging_dir="dist/${package_name}"
          mkdir -p "${staging_dir}/scripts"
          cp "$binary" "${staging_dir}/"
          cp LICENSE "${staging_dir}/"
          cp edge/pingora/vendor/owasp-crs/LICENSE "${staging_dir}/LICENSE-OWASP-CRS"
          cp scripts/install-openflare-edge.sh "${staging_dir}/scripts/"
          cp scripts/update-openflare-edge.sh "${staging_dir}/scripts/"
          cp scripts/uninstall-openflare-edge.sh "${staging_dir}/scripts/"
          cp scripts/fetch-agent-geoip-mmdb.sh "${staging_dir}/scripts/"
          printf '%s\n' "$VERSION" > "${staging_dir}/VERSION"
          (cd "${staging_dir}" && sha256sum openflare-edge > SHA256SUMS)
          tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"

      - name: Test Edge runtime
        env:
          TARGET: ${{ matrix.target }}
        run: python3 edge/pingora/tests/runtime_smoke.py "edge/pingora/target/${TARGET}/release/openflare-edge"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          name: OpenFlare Edge ${{ steps.version.outputs.version }}
          files: dist/openflare-edge_${{ steps.version.outputs.version }}_linux_${{ matrix.arch }}.tar.gz
