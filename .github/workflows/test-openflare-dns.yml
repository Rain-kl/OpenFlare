name: Test OpenFlare DNS

on:
  pull_request:
    paths:
      - dns/**
      - scripts/*-openflare-dns.sh
      - docker/Dockerfile.dns
      - docker/entrypoints/dns-entrypoint.sh
      - .github/workflows/test-openflare-dns.yml
  push:
    branches: [main, canary]
    tags: ["dns-v*"]
    paths:
      - dns/**
      - scripts/*-openflare-dns.sh
      - docker/Dockerfile.dns
      - docker/entrypoints/dns-entrypoint.sh
      - .github/workflows/test-openflare-dns.yml
  workflow_dispatch:

concurrency:
  group: dns-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_MANIFEST: dns/Cargo.toml
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    name: Test SmartDNS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment scripts
        run: |
          for script in scripts/{install,update,uninstall}-openflare-dns.sh; do
            bash -n "$script"
          done
          sh -n docker/entrypoints/dns-entrypoint.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache test dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dns
          shared-key: openflare-dns-test-${{ matrix.target }}
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: Run unit tests
        env:
          TARGET: ${{ matrix.target }}
        run: cargo test --locked --manifest-path "$CARGO_MANIFEST" --target "$TARGET"

      - name: Build and smoke-test binary
        env:
          TARGET: ${{ matrix.target }}
          OPENFLARE_DNS_VERSION: "0.0.0-ci"
        run: |
          cargo build --locked --manifest-path "$CARGO_MANIFEST" --target "$TARGET"
          binary="dns/target/${TARGET}/debug/openflare-dns"
          actual_version="$("$binary" --version)"
          [[ "$actual_version" == "openflare-dns 0.0.0-ci" ]] || {
            echo "unexpected binary version: $actual_version" >&2
            exit 1
          }
          "$binary" bench --queries 200 --concurrency 4
