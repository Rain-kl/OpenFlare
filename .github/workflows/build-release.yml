name: Build Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag (e.g. v1.0.0-beta); leave empty for canary prerelease"
        required: false
        type: string

env:
  APP_NAME: openflare-server
  GO_MAIN: ./cmd/server/main.go
  GO_BUILD_TAGS: embed_frontend
  GO_LDFLAGS: -s -w
  NODE_VERSION: "22"
  PNPM_VERSION: "10.10.0"
  FRONTEND_DIR: frontend
  FRONTEND_BUILD_COMMAND: pnpm build:embed
  FRONTEND_OUT_DIR: frontend/out
  EMBED_DIST_DIR: internal/router/root/dist
  EXTRA_FILES: |
    LICENSE
    README.md
    README_zh.md
    config.example.yaml
    DEPLOYMENT_zh.md

permissions:
  contents: write

jobs:
  prepare-message:
    runs-on: ubuntu-latest
    outputs:
      commit_msg: ${{ steps.message.outputs.commit_msg }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Read release commit message
        id: message
        shell: bash
        run: |
          msg=$(git log -1 --pretty=%B)
          echo "commit_msg<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$msg" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create Release
    needs: prepare-message
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      version_without_v: ${{ steps.metadata.outputs.version_without_v }}
      build_date: ${{ steps.metadata.outputs.build_date }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set release metadata
        id: metadata
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          input_version="${INPUT_VERSION//[[:space:]]/}"
          stable_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          elif [[ -n "$input_version" ]]; then
            version="$input_version"
          else
            version="$(git tag --points-at HEAD --list "v*-canary.${GITHUB_RUN_NUMBER}")"
            if [[ -z "$version" ]]; then
              stable="$(git tag --merged HEAD --sort=-version:refname --list 'v*' |
                awk -v pattern="$stable_pattern" '$0 ~ pattern && !found++')"
              if [[ "$stable" =~ $stable_pattern ]]; then
                base="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
              else
                base="0.1.0"
              fi
              version="v${base}-canary.${GITHUB_RUN_NUMBER}"
            fi
          fi

          if [[ ! "$version" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "expected a Server version tag such as v1.0.0 or v1.0.0-beta" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "version=$version"
            echo "version_without_v=${version#v}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.version }}
          name: ${{ steps.metadata.outputs.version }}
          body: ${{ needs.prepare-message.outputs.commit_msg }}
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          make_latest: ${{ steps.metadata.outputs.prerelease == 'false' }}

  build-frontend:
    name: Build Embedded Frontend
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ needs.create-release.outputs.version }}
          NEXT_PUBLIC_APP_BUILD_DATE: ${{ needs.create-release.outputs.build_date }}
        run: ${{ env.FRONTEND_BUILD_COMMAND }}
        working-directory: ${{ env.FRONTEND_DIR }}

      - name: Prepare embed directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EMBED_DIST_DIR"
          mkdir -p "$(dirname "$EMBED_DIST_DIR")"
          cp -R "$FRONTEND_OUT_DIR" "$EMBED_DIST_DIR"

      - name: Upload embedded frontend
        uses: actions/upload-artifact@v4
        with:
          name: embedded-frontend
          path: ${{ env.EMBED_DIST_DIR }}
          if-no-files-found: error
          retention-days: 1

  build-binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs:
      - create-release
      - build-frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download embedded frontend
        uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: ${{ env.EMBED_DIST_DIR }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.create-release.outputs.version }}
          BUILD_DATE: ${{ needs.create-release.outputs.build_date }}
        run: |
          set -euo pipefail

          mkdir -p dist
          binary_name="$APP_NAME"
          if [[ "$GOOS" == "windows" ]]; then
            binary_name="${binary_name}.exe"
          fi

          ldflags="$GO_LDFLAGS -X github.com/Rain-kl/Wavelet/internal/platform/buildinfo.Version=$VERSION -X github.com/Rain-kl/Wavelet/internal/platform/buildinfo.BuildTime=$BUILD_DATE"
          build_args=(
            -trimpath
            -ldflags "$ldflags"
            -o "dist/$binary_name"
          )

          if [[ -n "$GO_BUILD_TAGS" ]]; then
            build_args=(-tags "$GO_BUILD_TAGS" "${build_args[@]}")
          fi

          go build "${build_args[@]}" "$GO_MAIN"

          cli_name="openflare"
          if [[ "$GOOS" == "windows" ]]; then
            cli_name="${cli_name}.exe"
          fi
          go build -trimpath -ldflags "$ldflags" -o "dist/$cli_name" ./cmd/openflare

      - name: Package artifact
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          set -euo pipefail

          package_name="${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
          staging_dir="dist/$package_name"
          mkdir -p "$staging_dir"

          if [[ "$GOOS" == "windows" ]]; then
            cp "dist/${APP_NAME}.exe" "$staging_dir/"
          else
            cp "dist/${APP_NAME}" "$staging_dir/"
          fi

          while IFS= read -r extra_file; do
            [[ -z "$extra_file" ]] && continue
            if [[ -e "$extra_file" ]]; then
              cp -R "$extra_file" "$staging_dir/"
            fi
          done <<< "$EXTRA_FILES"

          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            (cd dist && zip -r "${package_name}.zip" "$package_name")
            artifact="dist/${package_name}.zip"
          else
            tar -C dist -czf "dist/${package_name}.tar.gz" "$package_name"
            artifact="dist/${package_name}.tar.gz"
          fi

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

          cli_package="openflare_cli_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$cli_package"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            cp dist/openflare.exe "dist/$cli_package/"
            (cd dist && zip -r "${cli_package}.zip" "$cli_package")
            cli_artifact="dist/${cli_package}.zip"
          else
            cp dist/openflare "dist/$cli_package/"
            tar -C dist -czf "dist/${cli_package}.tar.gz" "$cli_package"
            cli_artifact="dist/${cli_package}.tar.gz"
          fi
          echo "cli_artifact=$cli_artifact" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
          CLI_ARTIFACT: ${{ steps.package.outputs.cli_artifact }}
        run: gh release upload "$RELEASE_TAG" "$ARTIFACT" "$CLI_ARTIFACT" --clobber
