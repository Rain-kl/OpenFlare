<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{{title}}</title>
<style>:root{color-scheme:light dark;--bg:#fff;--fg:#313131;--muted:#686868;--line:#ddd}@media(prefers-color-scheme:dark){:root{--bg:#181818;--fg:#eee;--muted:#aaa;--line:#444}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}main{width:min(100% - 3rem,60rem);margin:12vh auto 3rem;flex:1}h1{font-size:clamp(1.75rem,5vw,2.5rem);line-height:1.25;font-weight:500;overflow-wrap:anywhere}h2{font-size:1.4rem;font-weight:500}p{color:var(--muted)}openflare-pow{display:block;margin:2rem 0}footer{border-top:1px solid var(--line);padding:1.25rem;text-align:center;font-size:.8rem;color:var(--muted)}details{margin-top:3rem;max-width:48rem}summary{cursor:pointer}</style>
</head>
<body>
<main>
<h1>{{host}}</h1>
<h2>{{title}}</h2>
<p>{{status}}</p>
{{widget}}
<details><summary>{{why}}</summary><p>{{why_description}}</p></details>
<noscript><p>{{noscript}}</p></noscript>
</main>
<footer>{{protected}}</footer>
</body>
</html>
