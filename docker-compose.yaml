services:
  openflare:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        VERSION: v0.9.9
#    image: ghcr.io/rain-kl/openflare:latest
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      OTEL_EXPORTER_OTLP_INSECURE: ${OTEL_EXPORTER_OTLP_INSECURE:-true}
      OTEL_SAMPLING_RATE: ${OTEL_SAMPLING_RATE:-1.0}
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./data/sqlite:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      jaeger:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-openflare}
      POSTGRES_USER: ${DB_USERNAME:-openflare}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace-with-strong-password}
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-openflare} -d ${DB_NAME:-openflare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.19.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_NAME:-openflare}
      CLICKHOUSE_USER: ${CLICKHOUSE_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-replace-with-clickhouse-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: ${TZ:-Asia/Shanghai}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./data/clickhouse_data:/var/lib/clickhouse
      - ./config/clickhouse/performance.xml:/etc/clickhouse-server/config.d/performance.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USERNAME:-default}", "--password", "${CLICKHOUSE_PASSWORD:-replace-with-clickhouse-password}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  edge:
    build:
      context: .
      dockerfile: docker/Dockerfile.edge
    container_name: openflare-edge
    restart: unless-stopped
    cap_add:
      - NET_RAW
    ports:
      - "${OPENFLARE_EDGE_HTTP_PORT:-8080}:8080"
      - "${OPENFLARE_EDGE_TLS_PORT:-8443}:8443"
    volumes:
      - ./data/edge:/var/lib/openflare-edge
    environment:
      OPENFLARE_EDGE_SERVER_URL: ${OPENFLARE_EDGE_SERVER_URL:-http://host.docker.internal:3000}
      OPENFLARE_EDGE_TOKEN_TYPE: ${OPENFLARE_EDGE_TOKEN_TYPE:-discovery}
      OPENFLARE_EDGE_TOKEN: ${OPENFLARE_EDGE_TOKEN:-}
      RUST_LOG: ${OPENFLARE_EDGE_LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.relay
    container_name: openflare-relay
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./data/relay/:/app/data
    environment:
      OPENFLARE_SERVER_URL: ${OPENFLARE_SERVER_URL:-http://host.docker.internal:3000}
      OPENFLARE_DISCOVERY_TOKEN: ${OPENFLARE_DISCOVERY_TOKEN:-}
      LOG_LEVEL: ${RELAY_LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  flared:
    build:
      context: .
      dockerfile: docker/Dockerfile.flared
    container_name: openflare-flared
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - ./data/flared/:/app/data
    environment:
      OPENFLARE_SERVER_URL: ${OPENFLARE_SERVER_URL:-http://host.docker.internal:3000}
      OPENFLARE_TUNNEL_TOKEN: ${OPENFLARE_TUNNEL_TOKEN:-}

  dns:
    build:
      context: .
      dockerfile: docker/Dockerfile.dns
    container_name: openflare-dns
    restart: unless-stopped
    ports:
      - "${OPENFLARE_DNS_PORT:-53}:5353/udp"
      - "${OPENFLARE_DNS_PORT:-53}:5353/tcp"
    volumes:
      - ./data/smartdns:/var/lib/openflare-dns
    environment:
      OPENFLARE_DNS_CONTROLLER_URL: ${OPENFLARE_DNS_CONTROLLER_URL:-http://host.docker.internal:3000}
      OPENFLARE_DNS_DISCOVERY_TOKEN: ${OPENFLARE_DNS_DISCOVERY_TOKEN:-}
      OPENFLARE_DNS_TOKEN: ${OPENFLARE_DNS_TOKEN:-}
      OPENFLARE_DNS_PUBLIC_ADDR: ${OPENFLARE_DNS_PUBLIC_ADDR:-}
      OPENFLARE_DNS_NAME: ${OPENFLARE_DNS_NAME:-Standalone SmartDNS}
      RUST_LOG: ${OPENFLARE_DNS_LOG_LEVEL:-info,hickory_server=warn}
    extra_hosts:
      - "host.docker.internal:host-gateway"
